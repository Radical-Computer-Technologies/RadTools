# Minimal RadBuild layer skeleton for PetaLinux 2023.2.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "radbuild"
BBFILE_PATTERN_radbuild = "^${LAYERDIR}/"
BBFILE_PRIORITY_radbuild = "6"

LAYERSERIES_COMPAT_radbuild = "langdale"
